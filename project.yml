# XcodeGen spec. CI runs `xcodegen generate` to create SwishAlley.xcodeproj (not checked in).
name: SwishAlley
options:
  bundleIdPrefix: com.heyobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  SwishAlley:
    type: application
    platform: iOS
    sources:
      - SwishAlley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.swishalley
        PRODUCT_NAME: SwishAlley
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: SwishAlley/Info.plist
      properties:
        CFBundleDisplayName: Swish Alley
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr, es, pt-BR, de]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.sports-games
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Optional: Swish Alley can use the front camera to find where your eyes are, so the hoop is drawn from your point of view and pops out in 3D. Frames are analysed on this device and never recorded, stored or sent. The game plays the same without it."
        UILaunchScreen:
          UIColorName: LaunchColor
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  SwishAlleyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SwishAlleyTests
    dependencies:
      - target: SwishAlley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.swishalley.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwishAlley.app/SwishAlley
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SwishAlley:
    build:
      targets:
        SwishAlley: all
        SwishAlleyTests: [test]
    test:
      targets:
        - SwishAlleyTests
    archive:
      config: Release
